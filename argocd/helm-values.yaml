# Argo CD chart 10.11.6 / application v3.5.6. Dashboard stays private.
createClusterRoles: false
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false
configs:
  cm:
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 5s
  params:
    server.insecure: true
  clusterCredentials:
    in-cluster:
      server: https://kubernetes.default.svc
      namespaces: habitapp
      clusterResources: false
      config: {}
server:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
