apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: habitapp
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/soundar1993s/HabitApp.git
  destinations:
    - namespace: habitapp
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: Ingress
