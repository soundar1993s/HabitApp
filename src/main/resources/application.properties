spring.application.name=habit-tracker
server.port=8080

# No datasource configured on purpose - this app has no external database.
# All habit data is held in-memory (ConcurrentHashMap) for the life of the process.

spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.version=${APP_VERSION:local}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
